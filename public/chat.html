<!DOCTYPE html>
<html>

<head>
<title>Between Us | Private chat</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="chat-container">

<div class="chat-header">
<div>Between Us<small id="room-label">Your private room</small></div>
<span id="connection-dot" class="connection-dot" aria-label="Connecting"></span>
</div>

<div id="chat-error" class="chat-error" role="alert" hidden></div>
<div id="chat"></div>

<div class="chat-input">
<input id="msg" maxlength="1000" placeholder="Write something just for you two..." autocomplete="off">
<button id="send-button" onclick="send()">Send</button>
</div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="chat.js"></script>

</body>

</html>
