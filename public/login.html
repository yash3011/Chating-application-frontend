<!DOCTYPE html>
<html>
<head>
<title>Between Us | Join a room</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<div class="eyebrow">Between Us</div>
<h2>Join Private Chat</h2>
<p class="subtitle">A quiet room for the conversations that belong to just you two.</p>

<input id="code" placeholder="Enter your room code" maxlength="6" autocomplete="off">

<button id="join-button" onclick="join()">Enter room</button>
<p id="status" class="status" role="alert"></p>

</div>

<script src="api-config.js"></script>
<script>

async function join(){

let code = document.getElementById("code").value.trim().toUpperCase();
let status = document.getElementById("status");
let button = document.getElementById("join-button");

if(!code){
	status.textContent = "Enter the code your partner shared with you.";
	status.className = "status error";
	return;
}

button.disabled = true;
status.textContent = "Checking your private room...";
status.className = "status";

try{
let res = await fetch(`${BACKEND_URL}/join-room`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({roomCode:code})
});
let data = await readResponse(res);

if(res.ok){

localStorage.setItem("room",code);

window.location="chat.html";

}else{
	status.textContent = data.msg || "That room is not available.";
	status.className = "status error";
}
}catch(error){
	status.textContent = "We could not reach the chat server. Try again in a moment.";
	status.className = "status error";
}finally{
	button.disabled = false;
}

}

</script>

</body>
</html>
